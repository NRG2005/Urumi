# Production only: Let's Encrypt certificates for the store and dashboard Ingresses.
# Install cert-manager first (see README "Production on a VPS"), then:
#   kubectl apply -f deploy/cluster-issuer.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com            # change me: expiry notices go here
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
