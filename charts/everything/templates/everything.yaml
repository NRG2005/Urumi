apiVersion: v1
kind: Service
metadata:
  name: everything
  labels: { app.kubernetes.io/part-of: urumi }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: everything }
  ports:
    - { name: http, port: 3001 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: everything
  labels: { app.kubernetes.io/part-of: urumi }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: everything }
  template:
    metadata:
      labels: { app.kubernetes.io/name: everything, app.kubernetes.io/part-of: urumi }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000   # "node"
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: everything
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          ports:
            - { name: http, containerPort: 3001 }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: everything-from-gateway-only
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.gatewayNamespace }} } }
          podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
      ports:
        - { port: 3001 }
