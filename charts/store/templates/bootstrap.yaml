{{- /*
One-shot WP-CLI Job that turns an empty WordPress into a working WooCommerce
store. Runs after every install/upgrade and is idempotent, so re-running it
is always safe.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-bootstrap
  labels: {{- include "store.labels" . | nindent 4 }}
data:
  bootstrap.sh: |
    set -eu
    cd /var/www/html

    echo "==> waiting for WordPress files (copied by the WordPress pod on first boot)"
    until [ -f wp-config.php ]; do sleep 3; done

    echo "==> waiting for MariaDB"
    until php -r 'exit(@mysqli_connect(getenv("WORDPRESS_DB_HOST"), getenv("WORDPRESS_DB_USER"), getenv("WORDPRESS_DB_PASSWORD"), getenv("WORDPRESS_DB_NAME")) ? 0 : 1);'; do sleep 3; done

    if ! wp core is-installed 2>/dev/null; then
      echo "==> installing WordPress"
      wp core install --url="$STORE_URL" --title="$STORE_TITLE" \
        --admin_user="$WP_ADMIN_USER" --admin_password="$WP_ADMIN_PASSWORD" \
        --admin_email="$WP_ADMIN_EMAIL" --skip-email
    fi
    wp option update home "$STORE_URL"
    wp option update siteurl "$STORE_URL"
    wp option update timezone_string "$STORE_TIMEZONE"
    # Pretty permalinks: /wp-json/... REST routes depend on them.
    wp rewrite structure '/%postname%/'

    echo "==> WooCommerce"
    if ! wp plugin is-installed woocommerce; then
      if [ -n "$WOO_VERSION" ]; then
        wp plugin install woocommerce --version="$WOO_VERSION"
      else
        wp plugin install woocommerce
      fi
    fi
    wp plugin activate woocommerce
    # On upgrades: run WordPress and WooCommerce database migrations for the new versions.
    wp core update-db
    wp wc update || true
    wp eval 'WC_Install::create_pages();'

    wp option update woocommerce_currency "$STORE_CURRENCY"
    wp option update woocommerce_default_country "IN:KA"
    # No shipping zones needed for the demo: physical products check out without a shipping method.
    wp option update woocommerce_ship_to_countries disabled
    # New stores start in "coming soon" mode, which hides the shop from visitors.
    wp option update woocommerce_coming_soon no
    wp option update woocommerce_onboarding_profile '{"skipped":true}' --format=json
    # Cash on delivery = test-friendly checkout.
    wp option update woocommerce_cod_settings \
      '{"enabled":"yes","title":"Cash on delivery","description":"Pay with cash upon delivery.","instructions":"","enable_for_methods":[],"enable_for_virtual":"yes"}' \
      --format=json

    echo "==> registering the woo-mcp REST API key"
    # WooCommerce stores the key as an HMAC hash and the secret in plain text,
    # exactly like keys created in WooCommerce > Settings > Advanced > REST API.
    wp eval '
      global $wpdb;
      $t    = $wpdb->prefix . "woocommerce_api_keys";
      $ck   = getenv("WOO_CONSUMER_KEY");
      $user = get_user_by("login", getenv("WP_ADMIN_USER"));
      $wpdb->delete($t, ["description" => "woo-mcp"]);
      $wpdb->insert($t, [
        "user_id"         => $user->ID,
        "description"     => "woo-mcp",
        "permissions"     => "read_write",
        "consumer_key"    => wc_api_hash($ck),
        "consumer_secret" => getenv("WOO_CONSUMER_SECRET"),
        "truncated_key"   => substr($ck, -7),
      ]);
      echo "api key id: " . $wpdb->insert_id . "\n";
    '

    echo "==> storefront: theme, homepage, catalogue"
    if [ "$STORE_THEME" = "urumi" ]; then
      # Our own theme, shipped in the chart (charts/store/theme) and mounted from a ConfigMap.
      mkdir -p wp-content/themes/urumi && cp -L /theme/* wp-content/themes/urumi/
    else
      wp theme is-installed "$STORE_THEME" || wp theme install "$STORE_THEME"
    fi
    wp theme activate "$STORE_THEME"
    wp option update blogname "$STORE_TITLE"
    wp option update blogdescription "$STORE_TAGLINE"
    HOME_ID=$(wp post list --post_type=page --name=home --field=ID --posts_per_page=1)
    [ -n "$HOME_ID" ] || HOME_ID=$(wp post create --post_type=page --post_title=Home --post_name=home --post_status=publish --porcelain)
    wp option update show_on_front page
    wp option update page_on_front "$HOME_ID"
    # WordPress's sample post and page have no place in a shop.
    for slug in hello-world sample-page; do
      wp post list --post_type=post,page --name="$slug" --field=ID | xargs -r wp post delete --force
    done
    wp eval-file /scripts/catalog.php

    echo "==> done: $STORE_URL"
  catalog.json: {{ .Values.storefront.catalog | toJson | quote }}
  catalog.php: |
    <?php
    // Creates the demo catalogue: one product per entry, skipped if a product with that
    // name already exists; adds the photo to any catalogue product that has none.
    require_once ABSPATH . 'wp-admin/includes/media.php';
    require_once ABSPATH . 'wp-admin/includes/file.php';
    require_once ABSPATH . 'wp-admin/includes/image.php';

    foreach (json_decode(file_get_contents('/scripts/catalog.json'), true) as $item) {
        $found = get_posts(['post_type' => 'product', 'title' => $item['name'], 'post_status' => ['publish', 'draft', 'private'], 'numberposts' => 1]);
        $product = $found ? wc_get_product($found[0]->ID) : new WC_Product_Simple();
        if (!$found) {
            $term = term_exists($item['category'], 'product_cat') ?: wp_insert_term($item['category'], 'product_cat');
            $product->set_name($item['name']);
            $product->set_regular_price($item['price']);
            if (!empty($item['sale'])) { $product->set_sale_price($item['sale']); }
            $product->set_short_description($item['description'] ?? '');
            $product->set_featured(!empty($item['featured']));
            $product->set_category_ids([(int) $term['term_id']]);
            $product->set_status('publish');
            $product->save();
            WP_CLI::log("created {$item['name']}");
        }
        if (!$product->get_image_id() && !empty($item['image'])) {
            $image_id = media_sideload_image($item['image'], $product->get_id(), $item['name'], 'id');
            if (is_wp_error($image_id)) {
                WP_CLI::warning("image for {$item['name']}: " . $image_id->get_error_message());
            } else {
                $product->set_image_id($image_id);
                $product->save();
            }
        }
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  # A plain Job (not a Helm hook), named per release revision so every install/upgrade runs it
  # once. It runs alongside the other pods instead of after `helm --wait`: woo-mcp only becomes
  # ready once the store is set up, so a post-install hook would wait forever on a first install.
  # Helm deletes the previous revision's Job; the latest one stays for `kubectl logs`.
  name: {{ .Release.Name }}-bootstrap-{{ .Release.Revision }}
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "store.labels" . | nindent 8 }}
        app.kubernetes.io/name: store-bootstrap
    spec:
      restartPolicy: Never
      # Same uid as Apache's www-data so files WP-CLI writes stay readable by WordPress.
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
      containers:
        - name: wp-cli
          image: {{ .Values.bootstrap.image }}
          command: ["sh", "/scripts/bootstrap.sh"]
          env:
            {{- include "store.wpEnv" . | nindent 12 }}
            - { name: HOME, value: /tmp }
            - { name: WP_CLI_CACHE_DIR, value: /tmp/wp-cli-cache }
            - { name: STORE_URL, value: {{ include "store.url" . | quote }} }
            - { name: STORE_TITLE, value: {{ .Values.store.title | quote }} }
            - { name: STORE_TIMEZONE, value: {{ .Values.store.timezone | quote }} }
            - { name: STORE_CURRENCY, value: {{ .Values.store.currency | quote }} }
            - { name: STORE_THEME, value: {{ .Values.storefront.theme | quote }} }
            - { name: STORE_TAGLINE, value: {{ .Values.storefront.tagline | quote }} }
            - { name: WOO_VERSION, value: {{ .Values.bootstrap.woocommerceVersion | quote }} }
            - { name: WP_ADMIN_USER, value: {{ .Values.store.adminUser | quote }} }
            - { name: WP_ADMIN_EMAIL, value: {{ .Values.store.adminEmail | quote }} }
            - name: WP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-secrets, key: wp-admin-password } }
            - name: WOO_CONSUMER_KEY
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-secrets, key: woo-consumer-key } }
            - name: WOO_CONSUMER_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-secrets, key: woo-consumer-secret } }
          volumeMounts:
            - { name: html, mountPath: /var/www/html }
            - { name: scripts, mountPath: /scripts }
            {{- if eq .Values.storefront.theme "urumi" }}
            - { name: theme, mountPath: /theme }
            {{- end }}
          resources: {{- toYaml .Values.bootstrap.resources | nindent 12 }}
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-wordpress
        - name: scripts
          configMap:
            name: {{ .Release.Name }}-bootstrap
        {{- if eq .Values.storefront.theme "urumi" }}
        - name: theme
          configMap:
            name: {{ .Release.Name }}-theme
        {{- end }}
