apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-wordpress
  labels: {{- include "store.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.wordpressSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-wordpress
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-wordpress
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  replicas: 1
  # The volume is ReadWriteOnce, so never run old and new pods side by side.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "store.labels" . | nindent 8 }}
        app.kubernetes.io/name: wordpress
    spec:
      securityContext:
        fsGroup: 33   # www-data
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image }}
          ports:
            - { name: http, containerPort: 80 }
          env: {{- include "store.wpEnv" . | nindent 12 }}
          volumeMounts:
            - { name: html, mountPath: /var/www/html }
          # First boot copies WordPress onto the volume, so give it time before liveness kicks in.
          startupProbe:
            httpGet: { path: /wp-login.php, port: http }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /wp-login.php, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.wordpress.resources | nindent 12 }}
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-wordpress
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-wordpress
  labels: {{- include "store.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.store.domain }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.store.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-wordpress
                port: { name: http }
