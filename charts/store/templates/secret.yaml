{{- /*
All store credentials are generated on first install. `lookup` reads the
existing Secret on upgrade so the values stay stable (otherwise every
`helm upgrade` would rotate the DB password and lock WordPress out).
*/ -}}
{{- $name := printf "%s-secrets" .Release.Name -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "store.labels" . | nindent 4 }}
  annotations:
    # Keep on uninstall: the MariaDB volume outlives the release and needs the same password.
    helm.sh/resource-policy: keep
type: Opaque
data:
  mariadb-root-password: {{ get $old "mariadb-root-password" | default (randAlphaNum 32 | b64enc) }}
  mariadb-password:      {{ get $old "mariadb-password"      | default (randAlphaNum 32 | b64enc) }}
  wp-admin-password:     {{ get $old "wp-admin-password"     | default (randAlphaNum 20 | b64enc) }}
  # WooCommerce REST API key used by woo-mcp. The bootstrap Job registers it in WooCommerce.
  woo-consumer-key:      {{ get $old "woo-consumer-key"      | default (printf "ck_%s" (randAlphaNum 40 | lower) | b64enc) }}
  woo-consumer-secret:   {{ get $old "woo-consumer-secret"   | default (printf "cs_%s" (randAlphaNum 40 | lower) | b64enc) }}
