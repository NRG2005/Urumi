# k3s VPS. Replace the domain with a real DNS name pointing at the VPS.
store:
  domain: store.4.194.18.91.sslip.io
  scheme: https
ingress:
  tls:
    enabled: true
    secretName: store-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
wooMcp:
  image: ghcr.io/nrg2005/urumi-woo-mcp:latest   # pushed by CI (.github/workflows/images.yml); local uses an imported woo-mcp:dev
  pullPolicy: Always
storage:
  storageClass: local-path
  wordpressSize: 5Gi
  mariadbSize: 5Gi
