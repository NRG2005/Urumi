{{- $name := "gateway-secrets" -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "gw.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Generated once, kept across upgrades.
  secret-key:        {{ include "gw.secretValue" (list $old "secret-key" "" true) }}
  admin-password:    {{ include "gw.secretValue" (list $old "admin-password" "" true) }}
  postgres-password: {{ include "gw.secretValue" (list $old "postgres-password" "" true) }}
  # Supplied by the operator via secrets.local.yaml (never committed).
  llm-api-key:       {{ include "gw.secretValue" (list $old "llm-api-key" .Values.llm.apiKey false) }}
  {{- range $env, $value := .Values.upstreams.credentials }}
  {{ $env | lower | replace "_" "-" }}: {{ include "gw.secretValue" (list $old ($env | lower | replace "_" "-") $value false) }}
  {{- end }}
