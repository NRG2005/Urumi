# Local cluster: one k3s node running inside Docker.
# k3s ships Traefik (ingress), local-path (storage) and a NetworkPolicy
# controller, so local behaves like the k3s VPS.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: urumi
servers: 1
agents: 0
ports:
  # Host port 80/443 -> k3d load balancer -> Traefik inside the cluster.
  - port: 80:80
    nodeFilters: [loadbalancer]
  - port: 443:443
    nodeFilters: [loadbalancer]
